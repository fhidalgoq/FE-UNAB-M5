<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <h1 class="text-center mb-4">Gestión de Pacientes</h1>

        <div class="d-flex gap-2 mb-3">
            <button class="btn btn-primary" onclick="mostrarTodos()">Cargar Pacientes</button>
            <input type="text" id="buscarNombre" class="form-control w-auto" placeholder="Ej: Juan Perez">
            <button class="btn btn-success" onclick="buscarPaciente()">Buscar</button>
        </div>

        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Edad</th>
                    <th>RUT</th>
                    <th>Diagnóstico</th>
                </tr>
            </thead>
            <tbody id="tablaPacientes">
                <tr>
                    <td colspan="4" class="text-center text-muted">No hay datos para mostrar</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="assets/js/index.js">
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
